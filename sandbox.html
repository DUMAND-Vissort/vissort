<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Vissort — Редактор стимула</title>
    <style>
        body { margin: 0; padding: 0; background: #111; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .canvas-area { flex: 1; display: flex; position: relative; background: #000; }
        #stim-display { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #time-display { position: absolute; top: 20px; right: 20px; font-family: monospace; font-size: 32px; color: #8b5cf6; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 8px; z-index: 10; }
        
        .controls-panel { width: 480px; height: 100%; background: #1e1e24; border-left: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; overflow-y: auto; }
        h3 { margin: 0 0 5px 0; color: #8b5cf6; font-size: 16px; }
        
        .settings-block { background: #16161a; padding: 10px; border-radius: 6px; border: 1px solid #333; }
        .row { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; }
        .row > label { width: 80px; font-size: 12px; color: #aaa; }
        
        input[type="number"], select, input[type="range"] { 
            flex: 1; 
            padding: 4px; 
            background: #0b0b12; 
            color: #fff; 
            border: 1px solid #333; 
            border-radius: 3px; 
            font-size: 12px; 
            font-family: monospace;
        }
        input[type="range"] { padding: 0; accent-color: #8b5cf6; }
        
        .node-block { background: #16161a; padding: 10px; border-radius: 6px; border: 1px solid #333; display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .node-block h4 { margin: 0; font-size: 13px; color: #8b5cf6; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        button { padding: 12px; background: #8b5cf6; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #7c3aed; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/oklume/oklume.css">
    <script src="https://unpkg.com/oklume/oklume.umd.js"></script>
</head>
<body>
    <div class="canvas-area">
        <div id="stim-display"><div id="stim"></div></div>
        <div id="time-display">00:00.0</div>
    </div>

    <div class="controls-panel">
        <h3>Конструктор анимации</h3>

        <div class="settings-block">
            <h4 style="margin:0 0 5px 0; font-size:12px; color:#aaa;">Жизненный цикл (сек)</h4>
            <div class="row"><label>Задержка 1:</label><input type="number" id="delay1" value="0" step="0.1"></div>
            <div class="row"><label>Показ:</label><input type="number" id="duration" value="10" step="0.1"></div>
            <div class="row"><label>Ожидание:</label><input type="number" id="responseTime" value="0" step="0.1"></div>
            <div class="row"><label>Задержка 2:</label><input type="number" id="delay2" value="0" step="0.1"></div>
        </div>

        <div class="settings-block">
            <div class="row"><label>Кол-во узлов:</label><input type="number" id="nodes-count" value="1" min="1" max="10"></div>
            <div class="row"><label>Повторы:</label><input type="number" id="repeats-count" value="1" min="1" max="20"></div>
            <div class="row"><label>Шаг (D):</label>
                <select id="step-size">
                    <option value="0.1" selected>0.1 D</option>
                    <option value="0.2">0.2 D</option>
                    <option value="0.3">0.3 D</option>
                    <option value="0.4">0.4 D</option>
                    <option value="0.5">0.5 D</option>
                    <option value="0.6">0.6 D</option>
                    <option value="0.7">0.7 D</option>
                    <option value="1.0">1.0 D</option>
                </select>
            </div>
            <div class="row"><label>Режим:</label>
                <select id="anim-mode">
                    <option value="smooth" selected>Плавно</option>
                    <option value="jump">Скачками</option>
                </select>
            </div>
            
            
            <button id="btn-calc" style="width: 100%; padding: 8px; background: #10b981; margin-top: 5px;">📊 Рассчитать список</button>
        </div>

        <div id="nodes-container"></div>

        <div style="display: flex; gap: 10px; margin-top: auto;">
            <button id="btn-play" style="flex: 1;">▶ Запустить</button>
            <button id="btn-pause" style="flex: 1; background: #eab308;" disabled>⏸ Пауза</button>
        </div>
    </div>
    <script src="sandbox.js"></script>
</body>
</html>
