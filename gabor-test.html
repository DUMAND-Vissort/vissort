<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Gabor Test Stand — Vissort</title>
    <style>
        body { background: #111115; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #gabor-canvas { background: #000; border: 1px solid #333; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .controls { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 30px; background: #1e1e24; padding: 15px 25px; border-radius: 8px; border: 1px solid #3f3f46; max-width: 750px; width: 100%; }
        .control-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .control-row label { font-size: 12px; color: #a1a1aa; white-space: nowrap; }
        .control-row input[type="range"] { flex: 1; min-width: 70px; accent-color: #8b5cf6; }
        .control-row input[type="number"] { width: 55px; background: #22222a; color: #fff; border: 1px solid #3f3f46; border-radius: 4px; padding: 2px 4px; font-size: 12px; }
        .control-row span { font-size: 12px; color: #fff; width: 45px; text-align: right; }
        .control-row select { background: #22222a; color: #fff; border: 1px solid #3f3f46; border-radius: 4px; padding: 2px 5px; font-size: 12px; }
        .control-row input[type="color"] { width: 40px; height: 25px; padding: 0; border: none; cursor: pointer; }
        .controls-header { grid-column: 1 / -1; text-align: center; font-size: 14px; font-weight: bold; color: #a78bfa; border-bottom: 1px solid #3f3f46; padding-bottom: 8px; margin-bottom: 5px; }
        .checkbox-row { grid-column: 1 / -1; display: flex; gap: 20px; justify-content: center; margin-top: 5px; }
        .checkbox-row label { font-size: 12px; color: #eee; cursor: pointer; }
    </style>
</head>
<body>

    <canvas id="gabor-canvas" width="500" height="500"></canvas>

    <div class="controls">
        <div class="controls-header">✨ Решётка Габора — Песочница</div>

        <!-- Центр -->
        <div class="control-row">
            <label>SF центра (цикл/град):</label>
            <input type="range" id="sf" min="0.5" max="40" step="0.1" value="10.0">
            <span id="sf-val">10.0</span>
        </div>
        <div class="control-row">
            <label>Ориентация (°):</label>
            <input type="range" id="orientation" min="0" max="180" step="1" value="0">
            <span id="orientation-val">0</span>
        </div>
        <div class="control-row">
            <label>Контраст центра (%):</label>
            <input type="range" id="contrast" min="0" max="100" step="1" value="100">
            <span id="contrast-val">100</span>
        </div>
        <div class="control-row">
            <label>Угловой размер σ (°):</label>
            <input type="range" id="sigmaDeg" min="0.1" max="5.0" step="0.1" value="1.0">
            <span id="sigmaDeg-val">1.0</span>
        </div>

        <!-- Кольцо -->
        <div class="control-row">
            <label>Кольцо SF (×):</label>
            <input type="range" id="ringSfRatio" min="0.1" max="3.0" step="0.1" value="1.0">
            <span id="ringSfRatio-val">1.0</span>
        </div>
        <div class="control-row">
            <label>Контраст кольца (%):</label>
            <input type="range" id="ringContrast" min="0" max="100" step="1" value="50">
            <span id="ringContrast-val">50</span>
        </div>
        <div class="control-row">
            <label>Радиус кольца (σ):</label>
            <input type="range" id="ringRadius" min="100" max="300" step="5" value="180">
            <span id="ringRadius-val">180</span>
        </div>
        <div class="control-row">
            <label>Толщина кольца (σ):</label>
            <input type="range" id="ringSigma" min="10" max="100" step="1" value="40">
            <span id="ringSigma-val">40</span>
        </div>

        <!-- Дополнительно -->
        <div class="control-row">
            <label>Эллиптичность (γ):</label>
            <input type="range" id="gamma" min="0.5" max="2.0" step="0.1" value="1.0">
            <span id="gamma-val">1.0</span>
        </div>
        <div class="control-row">
            <label>Скорость дрейфа:</label>
            <input type="range" id="speed" min="0" max="5" step="0.1" value="1.0">
            <span id="speed-val">1.0</span>
        </div>
        <div class="control-row">
            <label>Режим:</label>
            <select id="mode-drifting">
                <option value="smooth">Плавно</option>
                <option value="jump">Скачками</option>
            </select>
        </div>

        <!-- Цвета -->
        <div class="control-row">
            <label>Цвет A (пики):</label>
            <input type="color" id="colorA" value="#000000">
        </div>
        <div class="control-row">
            <label>Цвет B (впадины):</label>
            <input type="color" id="colorB" value="#ffffff">
        </div>
        <div class="control-row">
            <label>Цвет фона:</label>
            <input type="color" id="colorBg" value="#808080">
        </div>
        <div class="control-row">
            <label>Целевая яркость:</label>
            <input type="range" id="targetY" min="0" max="1" step="0.01" value="0.5">
            <span id="targetY-val">0.5</span>
        </div>

        <div class="checkbox-row">
            <label><input type="checkbox" id="isoLuminant"> Изолюминантность</label>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('gabor-canvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;

            let sf = 10.0;
            let orientation = 0;
            let contrast = 1.0;
            let sigmaDeg = 1.0;
            let gamma = 1.0;
            let speed = 1.0;
            let driftingMode = 'smooth';
            let startTime = performance.now();

            // Кольцо
            let ringSfRatio = 1.0;
            let ringContrast = 0.5;
            let ringRadius = 180;
            let ringSigma = 40;

            // Цвета
            let colorA = { r: 0, g: 0, b: 0 };
            let colorB = { r: 255, g: 255, b: 255 };
            let colorBg = { r: 128, g: 128, b: 128 };
            let isoLuminant = false;
            let targetY = 0.5;

            let PPI = 96;
            const savedPPI = localStorage.getItem('screenPPI');
            if (savedPPI && !isNaN(parseInt(savedPPI))) PPI = parseInt(savedPPI);
            else if (window.devicePixelRatio > 1) PPI = Math.round(96 * window.devicePixelRatio);

            const imgData = ctx.createImageData(w, h);
            const data = imgData.data;

            const infoDiv = document.createElement('div');
            infoDiv.id = 'info';
            infoDiv.style.cssText = 'margin-top: 10px; font-size: 12px; color: #a1a1aa; text-align: center;';
            document.body.appendChild(infoDiv);

            function hexToRgb(hex) {
                const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return r ? { r: parseInt(r[1],16), g: parseInt(r[2],16), b: parseInt(r[3],16) } : { r:0, g:0, b:0 };
            }
            function getLuminance(rgb) { return 0.2126*(rgb.r/255) + 0.7152*(rgb.g/255) + 0.0722*(rgb.b/255); }
            function adjustLuminance(rgb, tY) {
                const cur = getLuminance(rgb);
                if (cur === 0) return { r:0, g:0, b:0 };
                const f = tY / cur;
                return { r: Math.min(255, Math.max(0, Math.round(rgb.r*f))), g: Math.min(255, Math.max(0, Math.round(rgb.g*f))), b: Math.min(255, Math.max(0, Math.round(rgb.b*f))) };
            }

            function drawFrame(now) {
                const t = now - startTime;
                const timeSec = t / 1000;

                let psiRad = 0;
                if (driftingMode === 'smooth') psiRad = timeSec * speed * 20;
                else psiRad = (Math.floor(t / 300) % 2) * Math.PI;

                const theta = (orientation * Math.PI) / 180;
                const cosTheta = Math.cos(theta), sinTheta = Math.sin(theta);

                const sigmaRad = (sigmaDeg * Math.PI) / 180;
                const sigmaM = 1.0 * Math.tan(sigmaRad);
                let sigma = sigmaM * (PPI / 0.0254);
                if (sigma < 1) sigma = 1;

                const lambda = (1.0 * Math.tan((1/sf) * Math.PI / 180)) * (PPI / 0.0254);
                const omega = (2 * Math.PI) / Math.max(1, lambda);

                const twoSigmaSq = 2 * sigma * sigma;
                const gammaSq = gamma * gamma;

                // Кольцо: другая частота
                const ringOmega = omega * ringSfRatio;
                const ringTwoSigmaSq = 2 * ringSigma * ringSigma;

                let cA, cB, cBg;
                if (isoLuminant) {
                    cA = adjustLuminance(colorA, targetY);
                    cB = adjustLuminance(colorB, targetY);
                    cBg = adjustLuminance(colorBg, targetY);
                } else {
                    const f = targetY / 0.5;
                    cA = { r: Math.min(255, Math.max(0, colorA.r*f)), g: Math.min(255, Math.max(0, colorA.g*f)), b: Math.min(255, Math.max(0, colorA.b*f)) };
                    cB = { r: Math.min(255, Math.max(0, colorB.r*f)), g: Math.min(255, Math.max(0, colorB.g*f)), b: Math.min(255, Math.max(0, colorB.b*f)) };
                    cBg = { r: Math.min(255, Math.max(0, colorBg.r*f)), g: Math.min(255, Math.max(0, colorBg.g*f)), b: Math.min(255, Math.max(0, colorBg.b*f)) };
                }

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const dx = x - cx, dy = y - cy;

                        const xTheta = dx * cosTheta + dy * sinTheta;
                        const yTheta = -dx * sinTheta + dy * cosTheta;

                        // Центральный Габор
                        const gaussC = Math.exp(-(xTheta*xTheta + gammaSq*yTheta*yTheta) / twoSigmaSq);
                        const sinC = Math.cos(xTheta * omega + psiRad);
                        let val = gaussC * sinC * contrast;

                        // Кольцо (сегменты по кругу)
                        const distC = Math.sqrt(dx*dx + dy*dy);
                        const ringGauss = Math.exp(-Math.pow(distC - ringRadius, 2) / ringTwoSigmaSq);
                        const sinR = Math.cos(xTheta * ringOmega + psiRad);
                        val += ringGauss * sinR * ringContrast;

                        val = Math.max(-1, Math.min(1, val));

                        const valA = Math.max(0, val);
                        const valB = Math.max(0, -val);
                        const valBg = 1 - valA - valB;

                        const r = cA.r * valA + cB.r * valB + cBg.r * valBg;
                        const g = cA.g * valA + cB.g * valB + cBg.g * valBg;
                        const b = cA.b * valA + cB.b * valB + cBg.b * valBg;

                        const idx = (y * w + x) * 4;
                        data[idx] = Math.min(255, Math.max(0, r));
                        data[idx+1] = Math.min(255, Math.max(0, g));
                        data[idx+2] = Math.min(255, Math.max(0, b));
                        data[idx+3] = 255;
                    }
                }

                ctx.putImageData(imgData, 0, 0);

                infoDiv.textContent = `SF: ${sf.toFixed(1)} | σ: ${sigma.toFixed(0)}px | λ: ${lambda.toFixed(1)}px | PPI: ${PPI}`;
                requestAnimationFrame(drawFrame);
            }

            const bind = (id, valId, setter) => {
                const el = document.getElementById(id), valEl = document.getElementById(valId);
                if (!el) return;
                el.addEventListener('input', () => {
                    setter(parseFloat(el.value));
                    if (valEl) valEl.textContent = el.value;
                });
            };

            bind('sf', 'sf-val', v => sf = v);
            bind('orientation', 'orientation-val', v => orientation = v);
            bind('contrast', 'contrast-val', v => contrast = v / 100);
            bind('sigmaDeg', 'sigmaDeg-val', v => sigmaDeg = v);
            bind('gamma', 'gamma-val', v => gamma = v);
            bind('speed', 'speed-val', v => speed = v);
            bind('targetY', 'targetY-val', v => targetY = v);
            bind('ringSfRatio', 'ringSfRatio-val', v => ringSfRatio = v);
            bind('ringContrast', 'ringContrast-val', v => ringContrast = v / 100);
            bind('ringRadius', 'ringRadius-val', v => ringRadius = v);
            bind('ringSigma', 'ringSigma-val', v => ringSigma = v);

            document.getElementById('mode-drifting').addEventListener('change', e => driftingMode = e.target.value);
            document.getElementById('colorA').addEventListener('input', e => colorA = hexToRgb(e.target.value));
            document.getElementById('colorB').addEventListener('input', e => colorB = hexToRgb(e.target.value));
            document.getElementById('colorBg').addEventListener('input', e => colorBg = hexToRgb(e.target.value));
            document.getElementById('isoLuminant').addEventListener('change', e => isoLuminant = e.target.checked);

            requestAnimationFrame(drawFrame);
        })();
    </script>

</body>
</html>
